plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muklashdev.tmsounds'
    compileSdk 34

    defaultConfig {
        applicationId 'com.muklashdev.tmsounds'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: the app uses only Android framework APIs,
// so it stays tiny and builds anywhere.
dependencies {}
